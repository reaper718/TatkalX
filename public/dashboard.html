<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodLoop | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>

<body class="app-page">
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand-inline sidebar-brand" href="dashboard.html"><span
          class="brand-mark small">F</span><span>FoodLoop</span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <nav id="sidebarNav" class="nav flex-column"></nav>
      <div class="sidebar-bottom">
        <div class="user-mini">
          <div class="avatar" id="userInitial">U</div>
          <div><strong id="userName">User</strong><small id="userRole">Role</small></div>
        </div>
        <button class="btn btn-outline-secondary btn-sm w-100 mt-3" id="logoutButton">Sign out</button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="roleEyebrow">FOODLOOP WORKSPACE</div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-right"><span class="status-pill"><span class="pulse-dot"></span> Indore pilot</span></div>
      </header>
      <div id="alertBox"></div>
      <section id="dashboardContent"></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/dashboard.js"></script>
</body>

</html>
