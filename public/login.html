<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodLoop | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>

<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand">
      <div class="brand-mark">F</div>
      <p class="eyebrow">SURPLUS FOOD. SHARED PURPOSE.</p>
      <h1>Good food deserves<br>another destination.</h1>
      <p class="brand-copy">FoodLoop helps donors and NGOs coordinate surplus food collection through one reliable
        platform.</p>
      <!-- <div class="brand-note"><span class="pulse-dot"></span> Indore pilot platform</div> -->
    </section>
    <section class="auth-card">
      <div class="mb-4">
        <div class="brand-inline"><span class="brand-mark small">F</span><span>FoodLoop</span></div>
        <h2 class="mt-4">Welcome back</h2>
        <p class="muted">Sign in to continue to your workspace.</p>
      </div>
      <div id="alertBox"></div>
      <form id="loginForm">
        <label class="form-label" for="email">Email address</label>
        <input class="form-control form-control-lg mb-3" id="email" type="email" required autocomplete="email"
          placeholder="you@example.com">
        <label class="form-label" for="password">Password</label>
        <input class="form-control form-control-lg mb-4" id="password" type="password" required
          autocomplete="current-password" placeholder="Enter your password">
        <button class="btn btn-primary btn-lg w-100" type="submit" id="loginButton">Sign in</button>
      </form>
      <p class="small muted mt-4 mb-0">New to FoodLoop? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
</body>

</html>
